name: Bug 报告
description: 报告一个 Bug（扫描/渲染/文件操作）
labels: [bug]
body:
  - type: textarea
    id: what-happened
    attributes:
      label: 发生了什么
      description: 简单描述问题现象
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: 复现步骤
      placeholder: |
        1. 打开 DiskLens
        2. 选择目录 …
        3. 出现 …
    validations:
      required: true
  - type: input
    id: version
    attributes:
      label: DiskLens 版本
      placeholder: v1.0.0
    validations:
      required: true
  - type: input
    id: os
    attributes:
      label: 操作系统版本
      placeholder: Windows 11 23H2
    validations:
      required: true
  - type: textarea
    id: extra
    attributes:
      label: 截图 / 日志（可选）
